{{define "content"}}
<h1>Board</h1>
{{template "filters" .Filters}}
<p class="drop-error" role="alert" hidden></p>
<div id="issues" class="board">
  {{range .Columns}}
  <section class="column" data-column="{{.State}}">
    <h2>{{template "state" .State}} <span class="count">{{len .Cards}}</span></h2>
    {{range .Cards}}
    {{template "card" .}}
    {{else}}
    <p class="empty">Nothing here.</p>
    {{end}}
    {{if .ShowAllURL}}<a class="show-all" href="{{.ShowAllURL}}">Show all ({{.Hidden}} older)</a>{{end}}
  </section>
  {{end}}
</div>
{{end}}

{{define "scripts"}}<script src="/assets/drag.js" defer></script>{{end}}
