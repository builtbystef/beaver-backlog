{{define "content"}}
<h1>New issue</h1>
{{template "form-error" .Error}}
<form class="issue-form" method="post" action="/issues">
  <p>
    <label for="title">Title</label>
    <input id="title" name="title" value="{{.Form.Title}}" autofocus>
  </p>
  <p>
    <label for="description">Description</label>
    <textarea id="description" name="description" rows="10">{{.Form.Description}}</textarea>
  </p>
  <p>
    <label for="priority">Priority</label>
    <select id="priority" name="priority">
      {{template "options" .Priorities}}
    </select>
  </p>
  <p>
    <label for="labels">Labels</label>
    <input id="labels" name="labels" value="{{.Form.Labels}}" placeholder="bug, cli">
  </p>
  <p>
    <label for="depends_on">Depends on</label>
    <input id="depends_on" name="depends_on" value="{{.Form.DependsOn}}" placeholder="references, comma separated" list="issue-refs">
  </p>
  <p>
    <label for="parent">Parent</label>
    <input id="parent" name="parent" value="{{.Form.Parent}}" placeholder="reference" list="issue-refs">
  </p>
  {{template "issue-refs" .Refs}}
  <p class="actions">
    <button type="submit">Create issue</button>
    <a href="/">Cancel</a>
  </p>
</form>
{{end}}
