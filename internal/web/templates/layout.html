<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Beaver Backlog</title>
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/htmx.min.js" defer></script>
<script src="/assets/confirm.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Beaver Backlog</a>
  <nav>
    <a href="/">Board</a>
    <a href="/issues">Issues</a>
    <a href="/issues/new">New issue</a>
  </nav>
  <form class="search" action="/search" method="get" role="search">
    <input type="search" name="q" value="{{.Search}}" placeholder="Reference or text…" aria-label="Search issues">
  </form>
</header>
<main>
{{with .Notice}}<p class="notice" role="status">{{.}}</p>{{end}}
{{with .Warnings}}
<section class="banner" role="status">
  <p>{{len .}} file(s) skipped — not usable issues. Run <code>beaver doctor</code>.</p>
  <ul>
    {{range .}}<li><code>{{.Path}}</code> — {{.Reason}}</li>{{end}}
  </ul>
</section>
{{end}}
{{template "content" .}}
</main>
</body>
</html>
