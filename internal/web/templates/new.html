{{define "content"}}
<h1>New issue</h1>
{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<form class="issue-form" method="post" action="/issues">
  <p>
    <label for="title">Title</label>
    <input id="title" name="title" value="{{.Form.Title}}" autofocus>
  </p>
  <p>
    <label for="description">Description</label>
    <textarea id="description" name="description" rows="10">{{.Form.Description}}</textarea>
  </p>
  <p>
    <label for="priority">Priority</label>
    <select id="priority" name="priority">
      {{range .Priorities}}<option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>{{end}}
    </select>
  </p>
  <p>
    <label for="labels">Labels</label>
    <input id="labels" name="labels" value="{{.Form.Labels}}" placeholder="bug, cli">
  </p>
  <p>
    <label for="depends_on">Depends on</label>
    <input id="depends_on" name="depends_on" value="{{.Form.DependsOn}}" placeholder="references, comma separated">
  </p>
  <p>
    <label for="parent">Parent</label>
    <input id="parent" name="parent" value="{{.Form.Parent}}" placeholder="reference">
  </p>
  <p class="actions">
    <button type="submit">Create issue</button>
    <a href="/">Cancel</a>
  </p>
</form>
{{end}}
