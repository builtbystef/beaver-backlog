{{define "content"}}
<h1>{{.Ref}} names {{len .Matches}} issues</h1>
<p>A slug is not an identity — these issues share one. Pick the one you meant.</p>
<ul class="matches">
  {{range .Matches}}
  <li>
    <a class="id" href="/issues/{{.ID}}">{{.ID}}</a>
    {{.Title}}
    <span class="state state-{{.State}}">{{.State}}</span>
  </li>
  {{end}}
</ul>
{{end}}
