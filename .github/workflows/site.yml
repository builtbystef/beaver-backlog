# Builds the documentation site on every pull request (and every push to main)
# that touches it. A broken site fails before merge. Go-only changes do not
# run this job: npm stays confined to site/.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - "docs/assets/**"
      - "internal/web/styles/tailwind.css"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - "docs/assets/**"
      - "internal/web/styles/tailwind.css"

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: npm ci && npm run build
